<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d547"/>
      <stop offset="100%" stop-color="#e8c63a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101216"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d547"/>
      <stop offset="100%" stop-color="#e8c63a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow -->
  <circle cx="120" cy="120" r="420" fill="#f5d547" opacity="0.05"/>
  <circle cx="1080" cy="580" r="500" fill="#6aa9ff" opacity="0.05"/>

  <!-- Logo tile -->
  <rect x="80" y="90" width="130" height="130" rx="26" fill="url(#logoGrad)"/>
  <text x="145" y="180" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="74" text-anchor="middle" fill="#000">DS</text>

  <!-- Title -->
  <text x="248" y="180" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="112" fill="#fafafa" letter-spacing="-2">DubStubs</text>

  <!-- Subtitle -->
  <text x="248" y="232" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="32" fill="#a1a1aa">Design custom keepsake tickets.</text>

  <!-- Stylized ticket -->
  <g transform="translate(100, 320)">
    <rect x="8" y="12" width="1000" height="220" rx="14" fill="#000" opacity="0.4"/>
    <rect width="1000" height="220" rx="14" fill="url(#ticketGrad)"/>
    <line x1="780" y1="16" x2="780" y2="204" stroke="#000" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

    <!-- Ticketmaster-style mini layout -->
    <text x="22" y="42" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="14" fill="#000">MH1114</text>
    <text x="22" y="200" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#000">14NOV24</text>
    <text x="390" y="125" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="78" text-anchor="middle" fill="#000" letter-spacing="-2">YOUR EVENT</text>
    <text x="390" y="160" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#000">SAT NOV 14 · YOUR VENUE · YOUR CITY</text>
    <text x="390" y="200" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="14" text-anchor="middle" fill="#000" letter-spacing="2">DUBSTUBS.COM</text>

    <text x="888" y="42" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#000">ADULT  ISH</text>
    <text x="888" y="115" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="44" text-anchor="middle" fill="#000">GA · 12</text>
    <text x="888" y="148" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="13" text-anchor="middle" fill="#000">SEC / ROW / SEAT</text>
    <text x="888" y="200" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="#000">38.00</text>
  </g>

  <!-- Footer -->
  <text x="1120" y="600" font-family="Helvetica, Arial, sans-serif" font-weight="500" font-size="22" text-anchor="end" fill="#71717a">dubstubs.com</text>
</svg>
